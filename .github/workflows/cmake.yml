name: AstraLog CI/CD Pipeline

# Trigger the workflow automatically when code is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    # Define environment variables used across multiple steps
    env:
      # Create a unique directory path on the remote HPC using the commit SHA
      REMOTE_RUN_DIR: ${{ secrets.HPC_REMOTE_DIR }}/run-${{ github.sha }}
      # Standardize SSH options to bypass interactive prompts and use the custom key
      SSH_OPTS: "-i ~/.ssh/cineca_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${{ secrets.HPC_PORT }}"

    steps:
      # Pull source code into GitHub Actions runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up specific Python environment needed for testing
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Execute test suite to ensure code quality before deployment
      - name: Run tests with pytest
        run: |
          python3 -m pytest -v

      # Install Apptainer on the runner
      - name: Set up apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      # Build container image from definition file
      - name: Build Singularity image
        run: |
          apptainer build app_container.sif app_container.def

      # Configure SSH keys using GitHub Secrets to allow passwordless access to HPC
      - name: Setup SSH credentials
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HPC_SSH_KEY }}" > ~/.ssh/cineca_key
          echo "${{ secrets.HPC_CERT }}" > ~/.ssh/cineca_key-cert.pub
          chmod 600 ~/.ssh/cineca_key
          chmod 644 ~/.ssh/cineca_key-cert.pub

      # Connect to HPC and create unique target directories for this run
      - name: Prepare remote directory
        run: |
          ssh ${{ env.SSH_OPTS }} \
              ${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }} \
              "mkdir -p ${{ env.REMOTE_RUN_DIR }}/input"

      # Transfer built container image to HPC
      - name: Copy container to cluster
        run: |
          scp -i ~/.ssh/cineca_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -P ${{ secrets.HPC_PORT }} \
              app_container.sif \
              ${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }}:${{ env.REMOTE_RUN_DIR }}/

      # Transfer SLURM batch script to HPC
      - name: Copy job script to cluster
        run: |
          scp -i ~/.ssh/cineca_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -P ${{ secrets.HPC_PORT }} \
              job.sh \
              ${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }}:${{ env.REMOTE_RUN_DIR }}/

      # Transfer necessary input data and configuration files
      - name: Copy input files to cluster
        run: |
          scp -i ~/.ssh/cineca_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -P ${{ secrets.HPC_PORT }} \
              input/rules.json input/telemetry_cleaned.csv \
              ${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }}:${{ env.REMOTE_RUN_DIR }}/input/

      # Execute SLURM batch job on Galileo100 cluster
      - name: Submit SLURM job on Galileo100
        run: |
          ssh ${{ env.SSH_OPTS }} \
              ${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }} \
              "cd ${{ env.REMOTE_RUN_DIR }} && ls -R && sbatch job.sh"
