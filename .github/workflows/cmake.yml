name: AstraLog CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      REMOTE_RUN_DIR: ${{ secrets.HPC_REMOTE_DIR }}/run-${{ github.sha }}
      SSH_OPTS: "-i ~/.ssh/cineca_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${{ secrets.HPC_PORT }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          python3 -m pytest -v

      - name: Setup SSH credentials
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HPC_SSH_KEY }}" > ~/.ssh/cineca_key
          chmod 600 ~/.ssh/cineca_key

      - name: Debug SSH public key
        run: |
          ssh-keygen -y -f ~/.ssh/cineca_key
      - name: Prepare remote directory
        run: |
          ssh ${{ env.SSH_OPTS }} \
              ${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }} \
              "mkdir -p ${{ env.REMOTE_RUN_DIR }}/results"

      - name: Pull and run Singularity container on Galileo100
        run: |
          ssh ${{ env.SSH_OPTS }} \
              ${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }} \
              "cd ${{ env.REMOTE_RUN_DIR }} && \
               rm -f astralog_latest.sif && \
               singularity cache clean --force && \
               singularity pull --disable-cache docker://mcolombo2002/astralog:latest && \
               singularity exec --cleanenv astralog_latest.sif ls /usr/src/app && \
               mkdir -p results && \
               singularity exec --cleanenv \
                 --bind \${PWD}/results:/output \
                 astralog_latest.sif bash -lc '
                   cd /usr/src/app &&
                   python3 -m src.astralog_mock \
                     --rules input/rules.json \
                     --input input/telemetry_cleaned.csv \
                     --output /output
                 '"