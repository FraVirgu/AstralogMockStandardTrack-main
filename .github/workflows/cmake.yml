name: AstraLog CI/CD Pipeline

# Trigger the workflow automatically when code is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    # Define environment variables used across multiple steps
    env:
      # Create a unique directory path on the remote HPC using the commit SHA
      REMOTE_RUN_DIR: ${{ secrets.HPC_REMOTE_DIR }}/run-${{ github.sha }}
      # Standardize SSH options to bypass interactive prompts and use the custom key
      SSH_OPTS: "-i ~/.ssh/cineca_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${{ secrets.HPC_PORT }}"

    steps:
      # Configure SSH keys using GitHub Secrets to allow passwordless access to HPC
      - name: Setup SSH credentials
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HPC_SSH_KEY }}" > ~/.ssh/cineca_key
          echo "${{ secrets.HPC_CERT }}" > ~/.ssh/cineca_key-cert.pub
          chmod 600 ~/.ssh/cineca_key
          chmod 644 ~/.ssh/cineca_key-cert.pub

      # Connect to HPC and create unique target directories for this run
      - name: Prepare remote directory
        run: |
          ssh ${{ env.SSH_OPTS }} \
              ${{ secrets.HPC_USER }}@${{ secrets.HPC_HOST }} \
              "mkdir -p ${{ env.REMOTE_RUN_DIR }}/input"
